name: test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
            version: 2.5.5

      - name: Run Biome
        run: biome ci .

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install
      - run: npm run lint
      - run: npm test
